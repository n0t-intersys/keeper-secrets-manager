[project]
name = "ksm-team-tools"
version = "0.1.0"
description = "Team tooling to pull secrets from Keeper Secrets Manager at runtime instead of hard-coding them."
requires-python = ">=3.9"
dependencies = [
    "keeper-secrets-manager-core>=16.6.0",
    "keyring>=24.0.0",
]

[tool.setuptools]
packages = ["ksm"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
