name: Build installer

# Builds the Windows .exe installer. Runs on demand, and on version tags it
# attaches the installer to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create releases / upload assets

jobs:
  build:
    runs-on: windows-latest   # ISCC.exe is Windows-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: .\installer\build.ps1 -PythonVersion 3.12.8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSM-Setup
          path: installer/Output/*.exe
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
